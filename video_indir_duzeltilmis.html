<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video İndir</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#19263b;margin:0}header{padding:22px;background:white;border-bottom:1px solid #e3e8f0;font-weight:bold;font-size:22px}main{max-width:600px;margin:55px auto;padding:20px}h1{text-align:center;font-size:35px}p{text-align:center;color:#66758c;line-height:1.6}.card{background:white;border:1px solid #e3e8f0;border-radius:18px;padding:22px;box-shadow:0 12px 35px #17203312}label{display:block;font-weight:bold;margin:12px 0}select,input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:10px;font-size:16px}select,input{border:1px solid #cad4e2;background:white}button{background:#3768e8;color:white;border:0;margin-top:15px;font-weight:bold}#result{text-align:left;min-height:25px;color:#2859c9}small{color:#66758c;line-height:1.6;display:block}</style></head><body><header>▶ Video İndir</header><main><h1>Video bağlantını ekle</h1><p>Platformunu seç ve bağlantıyı kontrol et.</p><div class="card"><label for="platform">Platform</label><select id="platform"><option value="TikTok">TikTok</option><option value="YouTube">YouTube</option><option value="Instagram">Instagram</option><option value="Facebook">Facebook</option><option value="X">X</option><option value="Diğer">Diğer</option></select><label for="url">Video bağlantısı</label><input id="url" type="url" placeholder="https://..." autocomplete="off"><button type="button" id="check">Bağlantıyı kontrol et</button><p id="result" role="status"></p><small>Bu sayfa bağlantı biçimini kontrol eder, videoyu indirmez. İndirme yalnızca izin verilen içerikler ve uygun entegrasyonlarla sağlanabilir.</small></div></main><script>document.getElementById("check").addEventListener("click",function(){var u=document.getElementById("url").value.trim(),p=document.getElementById("platform").value,r=document.getElementById("result");try{var parsed=new URL(u);if(parsed.protocol!=="https:"&&parsed.protocol!=="http:")throw Error();r.textContent=p+" seçildi. Bağlantı biçimi geçerli. Bu demo sürümünde indirme henüz etkin değil."}catch(e){r.textContent="Lütfen geçerli bir bağlantı girin."}});</script></body></html>
